<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Léa - Manuel d'Histoire Universel (jusqu'en 2026)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 440px;
            height: 650px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chat-header {
            background: #0ea5e9;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 88%;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.93rem;
            line-height: 1.5;
            white-space: pre-line;
        }
        .message.bot { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.user { background: #0ea5e9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-input-area button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 0 16px;
            margin-left: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>🌍 Léa - Manuel d'Histoire (Jusqu'en 2026)</span>
            <a href="index.html" class="back-btn">Menu 🏠</a>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Coucou ma pupuce ! C'est Léa version Manuel d'Histoire Géant & Moderne. 
Le dictionnaire intègre l'Antiquité, les guerres, mais aussi les événements jusqu'en 2026 (Mur de Berlin, Bataclan, JO de Paris...). Teste ce que tu veux !</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ex: 2024, bataclan, 1789, rome..." autofocus>
            <button id="sendBtn">Envoyer</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById("userInput");
        const sendButton = document.getElementById("sendBtn");
        const messagesContainer = document.getElementById("chatMessages");

        sendButton.addEventListener("click", envoyerMessage);
        inputField.addEventListener("keypress", (e) => { 
            if (e.key === "Enter") envoyerMessage(); 
        });

        function ajouterMessage(texte, expediteur) {
            const div = document.createElement("div");
            div.classList.add("message", expediteur);
            div.textContent = texte;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
